name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Verify Python files
      run: |
        python -m py_compile src/*.py || echo "Python files syntax check"
    
    - name: Validate JSON files
      run: |
        python -c "import json; json.load(open('allowlist.json'))"
        echo "allowlist.json is valid JSON"
    
    - name: Check documentation
      run: |
        echo "Verifying documentation structure..."
        test -f README.md
        test -f docs/contributors.md
        test -f docs/provenance/epoch-3/README.md
        echo "Documentation structure verified"
